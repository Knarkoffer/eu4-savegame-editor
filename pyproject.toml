[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu4-savegame-editor"
version = "1.0.0"
description = "A command-line tool for editing plain-text Europa Universalis IV save files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Knarkoffer" }]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.15.0",
]

[project.scripts]
eu4-savegame-editor = "eu4_savegame_editor:main"

[tool.setuptools]
py-modules = ["eu4_savegame_editor"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]
